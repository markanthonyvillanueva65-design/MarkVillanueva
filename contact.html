<section>

    <h2>Contact Information</h2>

    <p><strong>Name:</strong> Mark Anthony Villanueva</p>
    <p><strong>Email:</strong> your-email@example.com</p>

    <hr>

    <h2>Send Me a Message</h2>

    <form>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label>Gender:</label>

        <div class="radio-group">
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>

        <br>

        <label>Interests:</label>

        <div class="checkbox-group">
            <input type="checkbox" id="html" name="interest" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="technology" name="interest" value="Technology">
            <label for="technology">Technology</label>

            <input type="checkbox" id="games" name="interest" value="Games">
            <label for="games">Games</label>
        </div>

        <br><br>

        <label for="topic">Choose a Topic:</label>

        <select id="topic" name="topic">
            <option value="">-- Select a Topic --</option>
            <option value="question">Question</option>
            <option value="feedback">Feedback</option>
            <option value="project">Project Inquiry</option>
            <option value="other">Other</option>
        </select>

        <label for="message">Your Message:</label>

        <textarea id="message" name="message" rows="6"
            placeholder="Write your message here..."></textarea>

        <button type="submit" class="submit-btn">Submit</button>

        <button type="reset" class="reset-btn">Reset</button>

    </form>

</section>
